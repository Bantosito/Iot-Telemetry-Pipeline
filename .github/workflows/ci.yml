# Runs on every push and pull request: lint, test, then build the images.
# A red X on GitHub means one of these steps failed - click it to see which.

name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same Makefile targets as local `make check`, so the two can't drift apart.
      - name: Lint (ruff)
        run: make lint

      - name: Test (pytest)
        run: make test

  build-images:
    # Only worth building if the code passed its checks.
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches what tests can't: a broken Dockerfile, a missing file in a
      # COPY, a requirement that won't install on Linux.
      - name: Build images
        run: make build
